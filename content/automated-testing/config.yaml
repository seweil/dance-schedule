# Per-content-set config, read at build time — see docs/design/content-config.md.
# `features` is exposed to client-side code via the virtual:content-config module
# (vite-plugin-content-config.ts). `manifest` (name/shortName) is build-time only,
# used to construct vite.config.ts's per-set PWA manifest — omitted here since this
# set's values already match the defaults (see content-config.ts's
# loadContentManifestStrings); content/test/config.yaml shows an explicit override.

features:
  # Whether the dance-schedule level slider treats A1 and A2 as a single
  # combined stop (see docs/design/dance-schedule.md's LevelSlot decision).
  combineA1A2: true

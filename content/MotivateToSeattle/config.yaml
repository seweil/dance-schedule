# Per-content-set config for the "MotivateToSeattle" event — see
# docs/design/content-config.md.

features:
  # Both true — the recommended default per docs/adding-a-new-event.md. This
  # event's registration levels start at A2 (no SSD/MS/Plus/A1 sessions at
  # all, per the registration form), so combineA1A2 has no dancers to affect
  # either way — left at the default rather than special-cased for that.
  combineA1A2: true
  combineC3BC4: true

manifest:
  # "Name - Summary" — per direct product decision on the /events landing
  # page (EventsListPage.tsx): a hyphen between name and summary, not the
  # summary itself in parens. The date range shown alongside it there is
  # NOT hand-typed here — it's computed at build time straight from this
  # set's own dance-schedule.xlsx (see vite-plugin-content-sets.ts's
  # computeDanceScheduleDateRange), so it can't drift from the real
  # schedule data the way a hand-maintained string could.
  name: Motivate to Seattle - 2026 West Coast A & C Weekend
  shortName: MTS 2026

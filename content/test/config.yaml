# Per-content-set config, read at build time — see docs/design/content-config.md.
# `features` is exposed to client-side code via the virtual:content-config module
# (vite-plugin-content-config.ts). `manifest` (name/shortName) is build-time only,
# used to construct vite.config.ts's per-set PWA manifest.

features:
  # Both true (the built-in default — see vite-plugin-content-config.ts, and also
  # content/automated-testing/config.yaml's own setting) so the "test" content set
  # exercises both merged-slot behaviors too — see docs/design/dance-schedule.md's
  # LevelSlot decision. Spelled out explicitly here anyway, alongside `manifest`
  # below, rather than relying on the default.
  combineA1A2: true
  combineC3BC4: true

manifest:
  # Distinguishes this set's installed icon/app name from "automated-testing"'s, so
  # the two are never confused once both are installed side by side — see
  # docs/design/content-config.md.
  name: Dance Schedule (Test)
  shortName: DS Test

# Sorted last (and flagged as a fixture, not a real event) on the /events
# landing page — see EventsListPage.tsx/sortContentSets.ts and
# docs/design/content-config.md.
testFixture: true

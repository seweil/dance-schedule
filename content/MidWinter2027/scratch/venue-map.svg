<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1330" viewBox="0 0 1000 1330" font-family="Avenir Next, Helvetica, Arial, sans-serif">
  <!-- Source for pages/assets/venue-map.png (render: see docs/design/midwinter-festival-2027.md).
       North-up, traced by hand from an aerial view; positions are approximate.
       Map content is drawn in the aerial's own coordinates, offset by translate(11, 80).

       Design: a quiet, cool base map; each festival building filled with the same
       color its program's cards have in the schedule grids (src/lib/levelColors.ts),
       outlined a shade deeper; and one accent, the festival's red diamond (its
       "Diamond Cir-Q-L8" playing-card theme), used only for orientation: the north
       arrow and the main entrance. Avenir Next: names Demi Bold, programs Regular,
       street names gray italic. -->
  <defs>
    <filter id="insetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="mapClip"><rect x="0" y="0" width="978" height="1240" rx="10"/></clipPath>
  </defs>

  <rect width="1000" height="1330" fill="#ffffff"/>
  <text x="11" y="40" font-size="32" font-weight="700" fill="#1f2933">Linn County Fair &amp; Expo Center</text>
  <text x="11" y="68" font-size="19" fill="#5b6672">and the two hotels next door</text>

  <g transform="translate(11, 80)">
    <g clip-path="url(#mapClip)">
      <!-- Ground, pavement, lawns -->
      <rect x="0" y="0" width="978" height="1240" fill="#eceff2"/>
      <rect x="50" y="425" width="640" height="815" fill="#dfe3e8"/>
      <path d="M60 195 H475 V95 H660 L682 118 V405 H60 Z" fill="#dfe3e8"/>
      <rect x="130" y="62" width="320" height="128" fill="#dfe3e8"/>
      <rect x="705" y="720" width="273" height="370" fill="#dfe3e8"/>
      <g stroke="#ccd2d9" stroke-width="2">
        <line x1="725" y1="770" x2="960" y2="770"/>
        <line x1="725" y1="830" x2="960" y2="830"/>
        <line x1="725" y1="890" x2="960" y2="890"/>
        <line x1="725" y1="950" x2="960" y2="950"/>
        <line x1="725" y1="1010" x2="960" y2="1010"/>
      </g>
      <rect x="182" y="806" width="152" height="106" rx="4" fill="#d3e2c7"/>

      <!-- Roads -->
      <rect x="-2" y="12" width="982" height="46" fill="#ffffff" stroke="#c5ccd4" stroke-width="2"/>
      <text x="958" y="42" text-anchor="end" font-size="20" font-style="italic" fill="#6b7682">Knox Butte Rd</text>
      <path d="M465 58 V195" stroke="#c5ccd4" stroke-width="34" fill="none"/>
      <path d="M465 58 V195" stroke="#ffffff" stroke-width="30" fill="none"/>
      <path d="M700 58 V630 Q700 690 760 690 H980" stroke="#c5ccd4" stroke-width="40" fill="none"/>
      <path d="M700 58 V630 Q700 690 760 690 H980" stroke="#ffffff" stroke-width="36" fill="none"/>

      <!-- Comfort Suites: Clogging -->
      <rect x="110" y="232" width="240" height="126" rx="5" fill="#ffe0b2" stroke="#c48a3a" stroke-width="2.5"/>
      <text x="230" y="285" text-anchor="middle" font-size="23" font-weight="600" fill="#1f2933">Comfort Suites</text>
      <text x="230" y="316" text-anchor="middle" font-size="21" fill="#1f2933">Clogging</text>

      <!-- Holiday Inn Express: Advanced -->
      <rect x="485" y="145" width="122" height="205" rx="5" fill="#d1c4e9" stroke="#7d6aa6" stroke-width="2.5"/>
      <text x="546" y="210" text-anchor="middle" font-size="21" font-weight="600" fill="#1f2933">Holiday Inn</text>
      <text x="546" y="235" text-anchor="middle" font-size="21" font-weight="600" fill="#1f2933">Express</text>
      <text x="546" y="275" text-anchor="middle" font-size="20" fill="#1f2933">Advanced</text>
      <text x="546" y="300" text-anchor="middle" font-size="17" fill="#3e4a56">A1, A2, C1</text>

      <!-- Willamette Event Center: Halls C (north), B, A (south), lobby and offices east -->
      <text x="425" y="470" font-size="20" font-weight="600" fill="#1f2933">Willamette</text>
      <text x="425" y="494" font-size="20" font-weight="600" fill="#1f2933">Event Center</text>
      <rect x="425" y="505" width="177" height="84" fill="#bbdefb" stroke="#4f86c0" stroke-width="2.5"/>
      <text x="513" y="541" text-anchor="middle" font-size="23" font-weight="600" fill="#1f2933">Hall C</text>
      <text x="513" y="568" text-anchor="middle" font-size="20" fill="#1f2933">Plus</text>
      <rect x="425" y="589" width="177" height="85" fill="#f8f9fa" stroke="#a3acb6" stroke-width="2"/>
      <text x="513" y="639" text-anchor="middle" font-size="23" font-weight="600" fill="#5b6672">Hall B</text>
      <rect x="425" y="674" width="177" height="84" fill="#a5d6a7" stroke="#4f8d53" stroke-width="2.5"/>
      <text x="513" y="710" text-anchor="middle" font-size="23" font-weight="600" fill="#1f2933">Hall A</text>
      <text x="513" y="737" text-anchor="middle" font-size="20" fill="#1f2933">Mainstream Ext</text>
      <rect x="602" y="576" width="50" height="182" fill="#f8f9fa" stroke="#a3acb6" stroke-width="2"/>

      <!-- Willamette Conference Center, at the northeast corner: Rooms 4 (north) to 1,
           glass hall on its east side (lcfairexpo floor plan; "To hotels" is north) -->
      <rect x="602" y="440" width="53" height="68" fill="#b2ebf2" stroke="#3f9aa5" stroke-width="2"/>
      <rect x="602" y="508" width="53" height="34" fill="#f8f9fa" stroke="#a3acb6" stroke-width="2"/>
      <rect x="602" y="542" width="53" height="34" fill="#c8e6c9" stroke="#6a9f6d" stroke-width="2"/>
      <rect x="655" y="440" width="13" height="136" fill="#e4e8ec" stroke="#a3acb6" stroke-width="2"/>

      <!-- Lawn with its circular path -->
      <circle cx="505" cy="863" r="100" fill="#d0d6dc"/>
      <circle cx="505" cy="863" r="84" fill="#d3e2c7"/>
      <line x1="505" y1="765" x2="505" y2="961" stroke="#d0d6dc" stroke-width="8"/>

      <!-- Other fairgrounds buildings (not used by the festival) -->
      <g fill="#f8f9fa" stroke="#a3acb6" stroke-width="2">
        <rect x="175" y="712" width="190" height="90" rx="3"/>
        <rect x="165" y="918" width="200" height="274" rx="3"/>
        <rect x="425" y="968" width="175" height="254" rx="3"/>
      </g>

      <!-- Main entrance plaza, marked with the festival's red diamond -->
      <rect x="612" y="772" width="78" height="186" fill="#d0d6dc"/>
      <path d="M678 844 L694 863 L678 882 L662 863 Z" fill="#e3261d" stroke="#ffffff" stroke-width="2.5"/>
      <text x="704" y="857" font-size="20" font-weight="600" fill="#1f2933">Main</text>
      <text x="704" y="881" font-size="20" font-weight="600" fill="#1f2933">entrance</text>
      <text x="840" y="1060" text-anchor="middle" font-size="21" font-style="italic" fill="#6b7682">Parking</text>

      <!-- North arrow: a red diamond, its north half solid -->
      <g transform="translate(880, 1150)">
        <path d="M0 -44 L18 0 L0 44 L-18 0 Z" fill="#ffffff" stroke="#e3261d" stroke-width="2.5"/>
        <path d="M0 -44 L18 0 L-18 0 Z" fill="#e3261d"/>
        <text x="0" y="-54" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2933">N</text>
      </g>
    </g>
    <rect x="0" y="0" width="978" height="1240" rx="10" fill="none" stroke="#b8c0c8" stroke-width="2"/>

    <!-- Guides from the small building's corners to the inset's left corners -->
    <g stroke="#3e4a56" stroke-width="3" stroke-dasharray="10 6" fill="none">
      <line x1="668" y1="440" x2="738" y2="92"/>
      <line x1="668" y1="576" x2="738" y2="652"/>
    </g>

    <!-- Enlarged inset of the Conference Center, lifted off the map by its shadow -->
    <rect x="745" y="104" width="228" height="560" rx="10" fill="#1f2933" opacity="0.45" filter="url(#insetShadow)"/>
    <rect x="738" y="92" width="228" height="560" rx="10" fill="#ffffff" stroke="#3e4a56" stroke-width="2"/>
    <text x="852" y="128" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2933">Conference Center</text>
    <!-- "To hotels", arrow up -->
    <path d="M950 152 L957 164 L943 164 Z" fill="#6b7682"/>
    <text x="937" y="165" text-anchor="end" font-size="16" font-style="italic" fill="#6b7682">To hotels</text>
    <rect x="760" y="182" width="145" height="210" fill="#b2ebf2" stroke="#3f9aa5" stroke-width="2.5"/>
    <rect x="760" y="392" width="145" height="105" fill="#f8f9fa" stroke="#a3acb6" stroke-width="2"/>
    <rect x="760" y="497" width="145" height="105" fill="#c8e6c9" stroke="#6a9f6d" stroke-width="2.5"/>
    <rect x="905" y="182" width="45" height="420" fill="#e4e8ec" stroke="#a3acb6" stroke-width="2"/>
    <text x="832" y="278" text-anchor="middle" font-size="21" font-weight="600" fill="#1f2933">Rooms 3 &amp; 4</text>
    <text x="832" y="306" text-anchor="middle" font-size="20" fill="#1f2933">Rounds</text>
    <text x="832" y="452" text-anchor="middle" font-size="21" font-weight="600" fill="#5b6672">Room 2</text>
    <text x="832" y="543" text-anchor="middle" font-size="21" font-weight="600" fill="#1f2933">Room 1</text>
    <text x="832" y="571" text-anchor="middle" font-size="20" fill="#1f2933">Relaxed MS</text>
    <text transform="translate(933, 392) rotate(90)" text-anchor="middle" font-size="17" font-style="italic" fill="#6b7682">Glass hall</text>
    <!-- "To Willamette lobby", arrow down -->
    <path d="M760 621 L774 621 L767 633 Z" fill="#6b7682"/>
    <text x="781" y="633" font-size="16" font-style="italic" fill="#6b7682">To Willamette lobby</text>
  </g>
</svg>

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudWatch RUM (Real User Monitoring) for the Dance Schedule PWA — client-side
  telemetry (device type, browser, OS, geography, page performance, JS/HTTP
  errors) plus app-specific custom events (date/level-filter/text-size usage,
  see src/lib/rum.ts) sent straight from the browser. Deployed independently of Amplify
  Hosting itself (which has no CloudFormation-manageable settings for its
  built-in access logs — see infra/README.md). See docs/design/monitoring.md
  for the rationale.

Parameters:
  AppMonitorName:
    Type: String
    Default: dance-schedule
    Description: Name of the CloudWatch RUM app monitor.
  Domains:
    Type: CommaDelimitedList
    Default: 'sqdance.app,*.sqdance.app,localhost'
    Description: >
      Domains the web client is allowed to send RUM events from (max 5).
      Add the Amplify-provided default domain too if you still use it, e.g.
      main.d1a2b3c4d5.amplifyapp.com — CommaDelimitedList, no spaces after commas.
  SessionSampleRate:
    Type: Number
    Default: 1
    Description: >
      Fraction of sessions to sample (0-1). 1 = 100%. Safe to leave at 1 for
      this app's traffic volume — CloudWatch RUM's free tier is 100,000
      events/month and a small community-event site won't come close.
  RetainTelemetryBeyond30Days:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      RUM keeps data for 30 days by default at no extra charge, with no way
      to run aggregate/group-by queries over it — only browsing one event at
      a time in the console. Setting this to true also copies every event to
      CloudWatch Logs (billed separately, ingestion + storage — pennies/month
      at this app's traffic), unlocking both longer retention and real
      aggregate reporting via CloudWatch Logs Insights — see infra/README.md.

Conditions:
  EnableCwLogs: !Equals [!Ref RetainTelemetryBeyond30Days, 'true']

Resources:
  RumIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub '${AppMonitorName}-rum-identity-pool'
      AllowUnauthenticatedIdentities: true

  RumGuestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppMonitorName}-rum-guest-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref RumIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: unauthenticated
      Policies:
        - PolicyName: PutRumEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rum:PutRumEvents
                Resource: !Sub 'arn:aws:rum:${AWS::Region}:${AWS::AccountId}:appmonitor/${AppMonitorName}'

  RumIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref RumIdentityPool
      Roles:
        unauthenticated: !GetAtt RumGuestRole.Arn

  RumAppMonitor:
    Type: AWS::RUM::AppMonitor
    Properties:
      Name: !Ref AppMonitorName
      DomainList: !Ref Domains
      Platform: Web
      CwLogEnabled: !If [EnableCwLogs, true, false]
      CustomEvents:
        Status: ENABLED
      AppMonitorConfiguration:
        AllowCookies: true
        EnableXRay: false
        SessionSampleRate: !Ref SessionSampleRate
        IdentityPoolId: !Ref RumIdentityPool
        GuestRoleArn: !GetAtt RumGuestRole.Arn
        Telemetries:
          - errors
          - performance
          - http

  # Saved CloudWatch Logs Insights queries (docs/ops.md's own "Retention and
  # aggregate reporting" section — this mirrors that doc's query text
  # exactly, so the two stay in sync by hand; there's no automated check for
  # that, given how small and rarely-changed this set is). Each one uses the
  # `SOURCE dataSource(['amazon_cloudwatch.rum_app_monitor'])` syntax, which
  # queries RUM's own managed data directly rather than a specific CloudWatch
  # Logs group — so, unlike the CwLogGroup name itself (see ops.md: "its name
  # isn't a fixed, predictable string," only discoverable via `aws rum
  # get-app-monitor` after the fact), these queries need no LogGroupNames
  # property and work regardless of which log group happens to be selected
  # in the console's own source picker when you open them from the Queries
  # tab. Requires CwLogEnabled (RetainTelemetryBeyond30Days above) to
  # actually return results — the queries themselves deploy either way, they
  # just won't have anything to query against if that's off.
  #
  # Deliberately excludes ops.md's own "Minimum-level histogram" query — its
  # own comment there explains why: the level-label-to-difficulty-rank
  # mapping inside it is tied to which slots THIS event's actual schedule
  # data happens to populate (combineA1A2/combineC3BC4 alone don't fully
  # determine it), so a saved copy here would silently go stale the next
  # time this app points at a different event's data, rather than getting
  # updated by hand at the same time the query is actually being used, the
  # way the doc's own version does.
  # count_distinct(user_details.sessionId), not count(*): a multi-page
  # session would otherwise inflate whichever device/browser/OS bucket it
  # falls into relative to a single-page session — same reasoning as
  # PlatformMixQuery below, applied here too so every non-Traffic query in
  # this file counts sessions, not raw page-load events.
  #
  # Normalizes two confirmed raw-data inconsistencies before grouping:
  # osName reports the same OS as both "Mac OS" and "macOS" (collapsed to
  # "macOS", the current Apple branding), and browserName reports the same
  # browser as both "Chrome" and "Google Chrome" (collapsed to "Google
  # Chrome", the more common of the two) — likely different UA tokens
  # across OS/browser versions, not a bug in this query. Deliberately NOT
  # applied to RawOsPermutationsQuery below, which exists specifically to
  # show raw, unnormalized values — that's what exposed this in the first
  # place.
  DevicesBrowsersOsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub '${AppMonitorName}/Devices, browsers, OS'
      QueryString: |-
        SOURCE dataSource(['amazon_cloudwatch.rum_app_monitor'])
        | fields metadata.deviceType, metadata.browserName, metadata.osName, user_details.sessionId as sessionId
        | filter event_type = "com.amazon.rum.page_view_event"
        | fields case(metadata.osName = "Mac OS", "macOS", metadata.osName) as osName,
                 case(metadata.browserName = "Chrome", "Google Chrome", metadata.browserName) as browserName
        | stats count_distinct(sessionId) as sessions by metadata.deviceType, browserName, osName
        | sort sessions desc

  InstalledVsBrowserQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub '${AppMonitorName}/Installed vs browser tab'
      QueryString: |-
        SOURCE dataSource(['amazon_cloudwatch.rum_app_monitor'])
        | fields metadata.displayMode, user_details.sessionId as sessionId
        | filter event_type = "com.amazon.rum.page_view_event"
        | stats count_distinct(sessionId) as sessions by metadata.displayMode

  PlatformMixQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub '${AppMonitorName}/Platform mix (mobile PWA-browser, desktop Mac-PC)'
      QueryString: |-
        SOURCE dataSource(['amazon_cloudwatch.rum_app_monitor'])
        | fields metadata.osName, metadata.displayMode, user_details.sessionId as sessionId
        | filter event_type = "com.amazon.rum.page_view_event"
        | fields case(
            metadata.osName like /iOS/ and metadata.displayMode = "standalone", "Mobile PWA (iOS)",
            metadata.osName like /Android/ and metadata.displayMode = "standalone", "Mobile PWA (Android)",
            metadata.osName like /iOS/, "Mobile browser (iOS)",
            metadata.osName like /Android/, "Mobile browser (Android)",
            metadata.osName like /Mac/, "Desktop (Mac)",
            metadata.osName like /Windows/, "Desktop (PC)",
            "Other"
          ) as platform
        | stats count_distinct(sessionId) as sessions by platform
        | sort sessions desc

  # A raw ground-truth query, not a bucketed one — added after THREE
  # separate case()-matching guesses in PlatformMixQuery above each failed
  # against real traffic in a way that looked, by eye, like it shouldn't
  # have (metadata.sessionId's wrong namespace; deviceType's iPad-as-
  # desktop misclassification; an osName = "iOS" exact match that still
  # didn't catch a real iPhone session showing what LOOKED like the exact
  # same "iOS" string). Rather than guess a fourth time, this lists every
  # ACTUAL (osName, displayMode, deviceType) combination present in the
  # data, with its own session count, sorted descending — plus
  # strlen(osName), specifically to catch invisible characters (trailing
  # whitespace, a non-breaking space, etc.) a value read off the console
  # and retyped into chat can't reveal, but a length that's NOT what it
  # visually looks like immediately would.
  RawOsPermutationsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub '${AppMonitorName}/Raw OS-displayMode-deviceType permutations'
      QueryString: |-
        SOURCE dataSource(['amazon_cloudwatch.rum_app_monitor'])
        | fields metadata.osName, strlen(metadata.osName) as osNameLen, metadata.displayMode, metadata.deviceType, user_details.sessionId as sessionId
        | filter event_type = "com.amazon.rum.page_view_event"
        | stats count_distinct(sessionId) as sessions by metadata.osName, osNameLen, metadata.displayMode, metadata.deviceType
        | sort sessions desc

  PagesViewedQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub '${AppMonitorName}/Pages viewed'
      QueryString: |-
        SOURCE dataSource(['amazon_cloudwatch.rum_app_monitor'])
        | fields metadata.pageId
        | filter event_type = "com.amazon.rum.page_view_event"
        | stats count(*) as views by metadata.pageId
        | sort views desc

  # Bucketed by day (bin(1d)) rather than left ungrouped, specifically so
  # the dashboard's own "Request Rate" widget can render it with
  # `"view": "timeSeries"` — a Logs Insights time-series line graph, not a
  # metric-math widget. Deliberately not the separate AWS/RUM CloudWatch
  # metric namespace (PageViewCount etc.) RUM also publishes to: that
  # namespace's exact dimension key isn't verifiable without a live,
  # authenticated `aws cloudwatch list-metrics` call, whereas staying on
  # Logs Insights keeps every query in this file on one mechanism.
  RequestRateQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub '${AppMonitorName}/Request rate over time'
      QueryString: |-
        SOURCE dataSource(['amazon_cloudwatch.rum_app_monitor'])
        | fields @timestamp
        | filter event_type = "com.amazon.rum.page_view_event"
        | stats count(*) as pageViews by bin(1d)

  # Same query as RequestRateQuery above but bucketed finer (15-minute, not
  # daily) — matches the dashboard's own "Request Rate (Last 3h)" widget,
  # which pins itself to the last 3 hours via widget-level start/end
  # regardless of the dashboard's own time-range picker (a QueryDefinition
  # has no equivalent of that pinning; pick your own time range when
  # running this one from the Queries tab).
  RequestRateRecentQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub '${AppMonitorName}/Request rate, fine-grained'
      QueryString: |-
        SOURCE dataSource(['amazon_cloudwatch.rum_app_monitor'])
        | fields @timestamp
        | filter event_type = "com.amazon.rum.page_view_event"
        | stats count(*) as pageViews by bin(15m)

  FontSizeQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub '${AppMonitorName}/Font size'
      QueryString: |-
        SOURCE dataSource(['amazon_cloudwatch.rum_app_monitor'])
        | fields event_details.textSize, user_details.sessionId as sessionId
        | filter event_type = "text_size_preference"
        | stats count_distinct(sessionId) as sessions by event_details.textSize

  LevelFilterRangeQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub '${AppMonitorName}/Level filter range'
      QueryString: |-
        SOURCE dataSource(['amazon_cloudwatch.rum_app_monitor'])
        | fields event_details.min, event_details.max, user_details.sessionId as sessionId
        | filter event_type = "dance_schedule_level_range"
        | stats count_distinct(sessionId) as sessions by event_details.min, event_details.max

  # A CloudWatch Dashboard, pinning several of the queries above (plus a
  # couple of event-specific ones that don't get their own standalone
  # QueryDefinition — see that resource block's own comment on why) as
  # always-visible widgets, rather than needing Logs Insights opened and a
  # saved query picked each time. Originally built by hand in the console;
  # exported (`aws cloudwatch get-dashboard`) and moved into
  # infra/dashboard.json (its own standalone file, not inline here, so it's
  # readable/diffable in a normal JSON viewer — see
  # docs/design/monitoring.md for the fuller rationale) so it's
  # redeployable/diffable instead of only living in one AWS account.
  # DashboardName is a NEW name, not whatever the original manually-created
  # dashboard was called — CloudFormation can't adopt an existing,
  # unmanaged resource just by matching its name (deploying a
  # AWS::CloudWatch::Dashboard whose name collides with one that already
  # exists outside CloudFormation fails outright, it doesn't take it over).
  # After confirming this one deploys and matches, delete the old
  # manually-created dashboard by hand — see infra/README.md.
  #
  # DashboardBody below is a LITERAL PLACEHOLDER LINE
  # (__DASHBOARD_JSON_PLACEHOLDER__), not the real content — an earlier
  # version tried passing infra/dashboard.json's content through as a
  # CloudFormation Parameter instead (String type, referenced here via
  # `!Ref`), which deploys BUT fails: CloudFormation Parameter values are
  # hard-capped at 4096 bytes, and this dashboard's own JSON is already
  # over 6000. A property embedded directly in a resource (not passed
  # through a Parameter) has no such per-value cap — confirmed live, this
  # exact content deployed fine as an inline block scalar before it was
  # ever parameterized — so ./infra/deploy.sh instead does its own tiny
  # text substitution: it reads THIS file, replaces this one placeholder
  # line with infra/dashboard.json's own content (re-indented to match,
  # line for line, inside this `|-` block scalar — which needs no quote/
  # backslash escaping the way a double-quoted YAML string would, only
  # consistent indentation), and deploys the RESULT, not this file
  # directly. See deploy.sh's own comment for the substitution itself.
  RumDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AppMonitorName}-dashboard'
      DashboardBody: |-
        __DASHBOARD_JSON_PLACEHOLDER__

Outputs:
  AppMonitorId:
    Description: Pass to the web client as VITE_RUM_APP_MONITOR_ID
    Value: !GetAtt RumAppMonitor.Id
  IdentityPoolId:
    Description: Pass to the web client as VITE_RUM_IDENTITY_POOL_ID
    Value: !Ref RumIdentityPool
  Region:
    Description: Pass to the web client as VITE_RUM_REGION
    Value: !Ref AWS::Region
